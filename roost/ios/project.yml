# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && cd roost/ios && xcodegen
# Then open Roost.xcodeproj. Personal settings live in Config.xcconfig.
name: Roost
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  RoostKit:
    path: RoostKit
targets:
  Roost:
    type: application
    platform: iOS
    sources:
      - path: Roost
    dependencies:
      - package: RoostKit
    info:
      path: Roost/Info.plist
      properties:
        CFBundleDisplayName: Roost
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCalendarsFullAccessUsageDescription: Roost shows your phone's calendars (Outlook, Gmail, iCloud) next to the family calendar and can copy family events into them.
        NSCalendarsWriteOnlyAccessUsageDescription: Roost can add family events to your own calendars.
        NSCalendarsUsageDescription: Roost shows your phone's calendars next to the family calendar.
        CFBundleURLTypes:
          - CFBundleURLName: roost
            CFBundleURLSchemes: [roost]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
        RoostServerHost: $(ROOST_SERVER_HOST)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ROOST_BUNDLE_ID)
        PRODUCT_NAME: Roost
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  Roost:
    build:
      targets:
        Roost: all
    run:
      config: Debug
    archive:
      config: Release
